<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive · AI in Education Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --font-content:   'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-editorial: 'Segoe Serif', 'Lora', Georgia, serif;
  --fg-primary:   #242424;
  --fg-secondary: #555555;
  --fg-tertiary:  #777777;
  --stroke-subtle:#EBEBEB;
  --surface:      #FFFFFF;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-content);
  color: var(--fg-primary);
  background: var(--surface);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.doc {
  max-width: 1020px;
  margin: 0 auto;
  padding: 64px 16px;
}
.wrap { max-width: 736px; margin: 0 auto; }

.masthead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--fg-primary);
  margin-bottom: 32px;
}
.masthead-title {
  font-size: 14px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em;
}
.masthead-links {
  font-size: 14px; color: var(--fg-secondary);
}
.masthead-links a {
  color: var(--fg-primary); text-decoration: underline;
  text-underline-offset: 3px;
}

h1 {
  font-family: var(--font-editorial);
  font-style: italic; font-weight: 400;
  font-size: 56px; line-height: 1.2;
  letter-spacing: -0.025em;
  margin-bottom: 16px;
}
.deck {
  font-size: 18px; color: var(--fg-secondary);
  max-width: 620px; margin-bottom: 64px;
}

.issue-list {
  list-style: none; padding: 0; margin: 0;
}
.issue {
  padding: 24px 0;
  border-top: 1px solid var(--stroke-subtle);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
}
.issue:first-child { border-top: 0; padding-top: 0; }
.issue-date {
  font-family: var(--font-editorial);
  font-style: italic; font-size: 20px;
  color: var(--fg-tertiary);
  flex-shrink: 0;
  min-width: 180px;
}
.issue-title {
  font-size: 18px; font-weight: 600;
  flex: 1;
}
.issue-title a {
  color: var(--fg-primary);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.colophon {
  margin-top: 96px; padding-top: 24px;
  border-top: 1px solid var(--stroke-subtle);
  font-size: 14px; color: var(--fg-tertiary);
  text-align: center; font-style: italic;
}
</style>
</head>
<body>
<div class="doc">
  <div class="wrap">

    <div class="masthead">
      <span class="masthead-title">AI in Education Daily</span>
      <span class="masthead-links">
        <a href="index.html">Latest issue</a>
      </span>
    </div>

    <h1>Archive.</h1>
    <p class="deck">Every issue of <em>AI in Education Daily</em>, most recent first.</p>

    <ol class="issue-list" reversed>
      <li class="issue">
        <span class="issue-date">September 8, 2026</span>
        <span class="issue-title">
          <a href="issues/2026-09-08.html">The week schools drew sharper AI lines.</a>
        </span>
      </li>
      <li class="issue">
        <span class="issue-date">September 3, 2026</span>
        <span class="issue-title">
          <a href="issues/2026-09-03.html">The week the largest district in America drew a line.</a>
        </span>
      </li>
    </ol>

    <div class="colophon">
      AI in Education Daily &middot; Archive
    </div>

  </div>
</div>
</body>
</html>
